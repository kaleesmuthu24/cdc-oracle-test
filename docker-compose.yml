name: cdc-rebuild-sandbox

services:
  kafka:
    image: quay.io/debezium/kafka:3.4
    container_name: cdc-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "cdc-rebuild-sandbox-cluster"
      NODE_ID: "1"
      PROCESS_ROLES: "broker,controller"
      CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      AUTO_CREATE_TOPICS_ENABLE: "true"
      OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      TRANSACTION_STATE_LOG_MIN_ISR: "1"
      GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafka-data:/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  oracle:
    image: gvenzl/oracle-free:23.26.2-slim-faststart
    container_name: cdc-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: appuser
      APP_USER_PASSWORD: apppass
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  postgres:
    image: postgres:17.6-bookworm
    container_name: cdc-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  ignite:
    image: apacheignite/ignite:2.18.0
    container_name: cdc-ignite
    ports:
      - "10800:10800"
    environment:
      IGNITE_QUIET: "false"
    volumes:
      - ignite-data:/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/10800' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  connect:
    build:
      context: ./connect
      dockerfile: Dockerfile
    image: cdc-rebuild-sandbox-connect
    container_name: cdc-connect
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      oracle:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: cdc-connect-cluster

      CONFIG_STORAGE_TOPIC: cdc-connect-configs
      OFFSET_STORAGE_TOPIC: cdc-connect-offsets
      STATUS_STORAGE_TOPIC: cdc-connect-status

      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_GROUP_ID: cdc-connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: cdc-connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: cdc-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: cdc-connect-status

      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"

      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      CONNECT_REST_HOST_NAME: 0.0.0.0
      CONNECT_REST_PORT: "8083"
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_ADVERTISED_PORT: "8083"

      CONNECT_PLUGIN_PATH: /kafka/connect
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: "60000"
      CONNECT_OFFSET_FLUSH_TIMEOUT_MS: "5000"
      CONNECT_TASK_SHUTDOWN_GRACEFUL_TIMEOUT_MS: "10000"

      KAFKA_HEAP_OPTS: "-Xms256M -Xmx1G"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s

  sink-app:
    build:
      context: ./sink-app
      dockerfile: Dockerfile
    image: cdc-rebuild-sandbox-sink-app
    container_name: cdc-sink-app
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ignite:
        condition: service_healthy
      connect:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # Change this if your actual Debezium topic is different.
      KAFKA_TOPIC: oracle-orders.RETAIL.ORDERS

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass

      IGNITE_HOST: ignite
      IGNITE_PORT: "10800"

      # Required for Apache Ignite thin client on Java 17+.
      # Your error was: java.base does not open java.nio.
      JAVA_TOOL_OPTIONS: >-
        --add-opens=java.base/java.nio=ALL-UNNAMED
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED
        --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
        --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED

    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'java' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  kafka-data:
  oracle-data:
  postgres-data:
  ignite-data: